[package]
name = "layerhook"
version = "0.1.3"
edition = "2021"
license = "GPL-3.0-only"
description = "Switches a QMK/Vial keyboard's active layer based on the focused window's title."
repository = "https://github.com/kolbenhans/layerhook"

[dependencies]
qmk-via-api = "0.9.0"
hidapi = "2.6.7"
regex = "1"
fancy-regex = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
eframe = { version = "0.36.1", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.36.1"
tray-icon = "0.24.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
cosmic-protocols = { version = "0.2", default-features = false, features = ["client"] }
x11rb = "0.14"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
] }
winreg = "0.52"

[profile.release]
lto = true
strip = true
codegen-units = 1
